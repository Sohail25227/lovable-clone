# Spring Boot configuration file
# YAML format — indentation matter karti hai (spaces, not tabs)

server:
  port: 8081   # App is port pe chalegi → http://localhost:8081

spring:
  application:
    name: lovable-clone
  datasource:
    url: jdbc:postgresql://localhost:5432/aibuilder
    username: aibuilder
    password: aibuilder123
  jpa:
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
jwt:
  # No default on purpose: app must fail fast if the secret is not supplied
  # export JWT_SECRET_KEY="<at least 32 random chars>"
  secret-key: ${JWT_SECRET_KEY}
