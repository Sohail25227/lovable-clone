# Spring Boot configuration file
# YAML format — indentation matter karti hai (spaces, not tabs)

server:
  port: 8081   # App is port pe chalegi → http://localhost:8081

spring:
  application:
    name: lovable-clone
  datasource:
    url: jdbc:postgresql://localhost:5432/aibuilder
    username: aibuilder
    password: aibuilder123
  jpa:
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.3
    retry:
      # Defaults (10 attempts, 2s initial, x5, 3m cap) ek request thread ko ~19 min
      # tak rok sakte hain. Generate synchronous hai, isliye budget chhota rakha hai:
      # worst case 3 calls aur 3s sleep (1s + 2s)
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 4s
      # 429 4xx hai, aur on-client-errors default false hai, to warna rate limit
      # NonTransient ban ke bina retry fail ho jata. Yeh list 4xx rule se pehle
      # check hoti hai, isliye sirf 429 transient hota hai — 401/400 nahi
      on-http-codes:
        - 429
jwt:
  # No default on purpose: app must fail fast if the secret is not supplied
  # export JWT_SECRET_KEY="<at least 32 random chars>"
  secret-key: ${JWT_SECRET_KEY}
