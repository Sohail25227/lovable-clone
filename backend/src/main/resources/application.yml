# Spring Boot configuration file
# YAML format — indentation matter karti hai (spaces, not tabs)

server:
  port: 8081   # App is port pe chalegi → http://localhost:8081

spring:
  application:
    name: lovable-clone
  datasource:
    url: jdbc:postgresql://localhost:5432/aibuilder
    username: aibuilder
    password: aibuilder123
  jpa:
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      # Retry yahan hai, spring.ai.retry.* mein nahi. Spring AI 2.0 ka OpenAI path
      # openai-java SDK (OkHttp) se jata hai, jo Spring ke RestClient aur uske
      # ResponseErrorHandler ko use hi nahi karta — isliye spring.ai.retry.* is model
      # par bilkul asar nahi karta. Yeh knob SDK ka hai, aur asli wahi hai.
      #
      # Default 3 attempts aur 60s timeout hain, matlab worst case ~3 min ek thread ka.
      # generate synchronous hai aur uske upar ek validation retry bhi hai, isliye
      # dono ko kasa gaya hai: 2 x 45s, yaani ~90s per validation attempt
      max-retries: 2
      timeout: 45s
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.3
jwt:
  # No default on purpose: app must fail fast if the secret is not supplied
  # export JWT_SECRET_KEY="<at least 32 random chars>"
  secret-key: ${JWT_SECRET_KEY}

app:
  # CORS ki allowed origin, aur preview ke CSP mein frame-ancestors — dono yahi padhte hain.
  # Secrets ke ulat iska default theek hai: yeh sensitive nahi hai aur Vite ka dev port hai
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
