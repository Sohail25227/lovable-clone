# Sirf woh cheezein jo production mein alag honi chahiye. Baaki sab application.yml se
# aati hai, aur secrets (GROQ_API_KEY, JWT_SECRET_KEY) plus SPRING_DATASOURCE_* env se.
#
# Activate karne ke liye: SPRING_PROFILES_ACTIVE=prod

server:
  tomcat:
    threads:
      # Default 200 hai. Yeh 512 MB ke instance pe do tarah se bekar hai: har thread ka apna
      # stack hai, aur 200 request ek saath aa bhi jayein to unke peeche sirf 5 database
      # connections aur ek 0.1-CPU box hai — woh queue tez jawab nahi, dheeme jawab deti hai.
      # Generation ke waqt thread Groq ka intezar karta hai, isliye kuch thread rakhna zaruri
      # hai; 20 ek hi user ke browser aur uske preview iframe ke liye kaafi se zyada hai
      max: 20

      # Idle pe do se zyada thread pakde rakhne ki koi wajah nahi; peak pe baaki ban jate hain
      min-spare: 2

spring:
  main:
    # Beans tab bante hain jab pehli baar chahiye hote hain, boot pe nahi. Naapa gaya:
    # idle 294 MB se 259 MB, 300 requests ke baad 357 MB se 319 MB, startup 16.0s se 14.1s.
    # Bachat load ke baad bhi rehti hai, yaani yeh sirf kaam ko aage khiskana nahi hai —
    # is app ke kai beans kabhi bante hi nahi.
    #
    # Iski keemat yeh hai ki bean banne ki galti boot ke bajaye pehli request pe dikhti hai,
    # aur deploy ke waqt yeh ulta padta hai: platform health check pass kar deta hai aur toota
    # hua build live ho jata hai. Isliye yeh sirf prod mein hai — dev mein eager rehna hi behtar
    # hai, wahan galti likhte waqt hi pakdi jaani chahiye.
    #
    # Do sabse khatarnak raaste check kiye gaye aur woh ab bhi fail-fast hain: DataSource aur
    # Flyway boot pe hi chalte hain, aur bina JWT_SECRET_KEY ke app exit code 1 pe mar jati hai
    # (JwtAuthFilter ek servlet filter hai, aur uske bina Tomcat start hi nahi hota)
    lazy-initialization: true

  jpa:
    # Dev mein yeh seekhne ke liye on hai, par har query ko log karna production mein
    # do tarah se mehnga hai: I/O, aur logs mein data ka chala jana
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  datasource:
    # Yahan waqt milliseconds mein hai, `30s` jaisi duration string mein nahi. Baaki Boot
    # config mein duration strings chalti hain, par yeh prefix seedha HikariDataSource par
    # bind hota hai aur uske setters plain long lete hain — Boot ka Duration conversion
    # beech mein aata hi nahi. `30s` likhne pe app boot hi nahi hoti
    hikari:
      # Neon free tier chhota hai aur 5 minute idle pe compute so jata hai. Bade pool ka
      # koi faayda nahi jab ek hi instance chal raha ho, aur har connection wahan paisa hai
      maximum-pool-size: 5

      # 30s. Soye hue database ka pehla connection kuch second leta hai. Yeh default hi hai,
      # par saaf likha hai taaki koi ise chhota karke wake-up ko failure na bana de
      connection-timeout: 30000

      # Idle connections ko zinda rakhne ka matlab compute jagaye rakhna hai
      minimum-idle: 1
      idle-timeout: 300000

logging:
  level:
    # Startup pe Flyway ka bolna chahiye — kaunsi migration chali, yeh production mein
    # sabse pehle dekhne wali cheez hoti hai jab schema shak ke ghere mein ho
    org.flywaydb: INFO
